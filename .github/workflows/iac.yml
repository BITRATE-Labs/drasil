name: IaC Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  impact:
    uses: ./.github/workflows/change-impact.yml

  terraform:
    needs: [impact]
    if: needs.impact.outputs.iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt (check)
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform validate (bootstrap)
        working-directory: infra/aws/bootstrap
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (prod)
        working-directory: infra/aws/prod
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (domain)
        working-directory: infra/aws/domain
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (intel)
        working-directory: infra/aws/intel
        run: terraform init -backend=false && terraform validate

  checkov:
    needs: [impact]
    if: needs.impact.outputs.iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkov (Terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/aws
          framework: terraform
          soft_fail: false

  actionlint:
    needs: [impact]
    if: needs.impact.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        uses: rhysd/actionlint@v1.7.10
