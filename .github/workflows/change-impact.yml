name: Change impact

on:
  workflow_call:
    inputs:
      deployment:
        type: string
        default: ''
    outputs:
      profile:
        value: ${{ jobs.classify.outputs.profile }}
      bot:
        value: ${{ jobs.classify.outputs.bot }}
      web:
        value: ${{ jobs.classify.outputs.web }}
      iac:
        value: ${{ jobs.classify.outputs.iac }}
      actionlint:
        value: ${{ jobs.classify.outputs.actionlint }}

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.impact.outputs.profile }}
      bot: ${{ steps.impact.outputs.bot }}
      web: ${{ steps.impact.outputs.web }}
      iac: ${{ steps.impact.outputs.iac }}
      actionlint: ${{ steps.impact.outputs.actionlint }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Classify the complete event diff
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # A PR cannot narrow its own checks by changing the classifier allowlist.
            if git cat-file -e "$BASE_SHA:scripts/classify-changes.mjs" 2>/dev/null; then
              git show "$BASE_SHA:scripts/classify-changes.mjs" > "$RUNNER_TEMP/classify-changes.mjs"
              node "$RUNNER_TEMP/classify-changes.mjs"
            else
              printf '%s\n' profile=full bot=true web=true iac=true actionlint=true >> "$GITHUB_OUTPUT"
            fi
          else
            node scripts/classify-changes.mjs
          fi
