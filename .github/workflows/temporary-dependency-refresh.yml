name: Temporary dependency refresh

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/dependency-maintenance-2026-11-23'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Refresh compatible lockfile without executing package scripts
        run: |
          cp package-lock.json "$RUNNER_TEMP/dependency-before-lock.json"
          npm audit --json > "$RUNNER_TEMP/dependency-before-audit.json" || true
          npm update --package-lock-only --ignore-scripts --workspaces --include-workspace-root
          npm audit --json > "$RUNNER_TEMP/dependency-after-audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/dependency-runtime-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const before = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'dependency-before-lock.json'), 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const kind of ['before', 'after', 'runtime']) {
            const audit = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'dependency-' + kind + '-audit.json'), 'utf8'));
            if (!audit.metadata?.vulnerabilities) throw new Error('Audit did not return vulnerability metadata: ' + kind);
            console.log('DRASIL_AUDIT_' + kind.toUpperCase() + ' ' + JSON.stringify(audit.metadata.vulnerabilities));
            if (kind === 'runtime') for (const [name, entry] of Object.entries(audit.vulnerabilities || {})) console.log('DRASIL_VULNERABILITY ' + JSON.stringify({ name, ...entry }));
          }
          let changes = 0;
          for (const [entry, value] of Object.entries(after.packages)) {
            if (value.resolved && /^https?:/.test(value.resolved) && !value.resolved.startsWith('https://registry.npmjs.org/')) throw new Error('Unexpected registry: ' + entry);
            if (before.packages[entry]?.version !== value.version) {
              changes++;
              console.log('DRASIL_UPDATE ' + JSON.stringify({ path: entry, from: before.packages[entry]?.version ?? null, to: value.version, engines: value.engines, optional: value.optional, dev: value.dev }));
            }
          }
          console.log('DRASIL_UPDATE_COUNT ' + changes);
          NODE
      - name: Commit only the lockfile to this maintenance branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          UPDATE_BRANCH: chore/dependency-maintenance-2026-11-23
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if git diff --quiet -- package-lock.json; then
            echo "DRASIL_NO_UPDATES"
            exit 0
          fi
          remote_head="$(git ls-remote origin "refs/heads/$UPDATE_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m '[AGENT] Refresh compatible dependencies for November 23'
          git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          echo "DRASIL_UPDATE_COMMIT=$(git rev-parse HEAD)"
