name: drasil-sandbox
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drasil_sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sandbox
    # Stay below Windows' default dynamic port range to avoid exclusions after restart.
    ports:
      - '127.0.0.1:15434:5432'
    volumes:
      - sandbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d drasil_sandbox']
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  sandbox-data:
